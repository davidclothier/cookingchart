{% extends "base.html" %}

{% block main_class %}max-w-7xl mx-auto px-4 sm:px-6 lg:px-8{% endblock %}

{% block extra_head %}
<style>
  .legal-page { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 40px; padding: 64px 0 0; }
  .legal-page h1 { font-size: clamp(34px, 4.6vw, 56px); line-height: 1.02; margin: 0 0 14px; font-weight: 400 !important; letter-spacing: -.02em; }
  .legal-page p.updated { font-size: 12px; margin: 0 0 12px; }
  .legal-page .lede { font-size: 21px; line-height: 1.55; color: var(--ink-soft); max-width: 34em; margin: 0; }
  .legal-page section { margin-top: 44px; padding-top: 26px; border-top: 1px solid var(--rule); max-width: 46rem; }
  .legal-page h2 { font-size: 26px; line-height: 1.15; margin: 0 0 12px; }
  .legal-page p, .legal-page li { font-size: 18px; line-height: 1.6; }
  .legal-page p { margin: 10px 0 0; }
  .legal-page ul { margin: 10px 0 0; padding-left: 1.2em; list-style: none; }
  .legal-page li { position: relative; margin: 6px 0; }
  .legal-page li::before { content: "—"; position: absolute; left: -1.2em; color: var(--heat); }
  .legal-page a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule); }
  .legal-page a:hover { color: var(--heat); text-decoration-color: var(--heat); }
  .legal-page code { font-family: var(--mono); font-size: .85em; background: var(--paper-deep); padding: 1px 5px; white-space: nowrap; }
  .legal-page table { border-collapse: collapse; margin-top: 14px; font-size: 16px; width: 100%; }
  .legal-page th, .legal-page td { text-align: left; vertical-align: top; padding: 8px 12px 8px 0; border-bottom: 1px dotted var(--rule); }
  .legal-page th { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; }
  .legal-page .table-wrap { overflow-x: auto; }
  @media (max-width: 860px) {
    .legal-page { grid-template-columns: minmax(0, 1fr); gap: 0; padding-top: 36px; }
    .legal-page .side { display: none; }
  }
</style>
{% endblock %}

{% block content %}
<div class="legal-page">
    <div class="side"><span class="label">{{ t('nav.legal') }}</span></div>
    <div>
        {% include 'content/legal_' ~ lang ~ '.html' %}
    </div>
</div>
{% endblock %}
